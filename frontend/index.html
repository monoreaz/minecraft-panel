<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Hosting</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <main class="page">
        <header class="header">
            <div class="header-copy">
                <h1>Minecraft Hosting</h1>

                <p class="header-subtitle">
                    Manage your Minecraft servers
                </p>
            </div>

            <div class="header-actions">
                <a class="button primary" href="/create">
                    Create server
                </a>

                <div id="account-menu" class="account-menu">
                    <button
                        id="account-button"
                        class="account-button"
                        type="button"
                        aria-label="Open account menu"
                        aria-expanded="false"
                        aria-controls="account-dropdown"
                    >
                        <span id="account-avatar" class="account-avatar">
                            ?
                        </span>
                    </button>

                    <div
                        id="account-dropdown"
                        class="account-dropdown"
                        hidden
                    >
                        <div class="account-details">
                            <strong id="account-username">
                                Loading...
                            </strong>

                            <span id="account-email"></span>
                        </div>

                        <button
                            id="logout-button"
                            class="account-logout"
                            type="button"
                        >
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div id="message" class="message" aria-live="polite"></div>

        <section id="server-list" class="server-list"></section>
    </main>

    <script src="/static/auth.js"></script>

    <script>
        const accountMenu =
            document.getElementById("account-menu");

        const accountButton =
            document.getElementById("account-button");

        const accountDropdown =
            document.getElementById("account-dropdown");

        const accountAvatar =
            document.getElementById("account-avatar");

        const accountUsername =
            document.getElementById("account-username");

        const accountEmail =
            document.getElementById("account-email");

        const logoutButton =
            document.getElementById("logout-button");


        function closeAccountMenu() {
            accountDropdown.hidden = true;

            accountButton.setAttribute(
                "aria-expanded",
                "false"
            );
        }


        accountButton.addEventListener(
            "click",
            () => {
                const shouldOpen =
                    accountDropdown.hidden;

                accountDropdown.hidden =
                    !shouldOpen;

                accountButton.setAttribute(
                    "aria-expanded",
                    String(shouldOpen)
                );
            }
        );


        logoutButton.addEventListener(
            "click",
            Auth.logout
        );


        document.addEventListener(
            "click",
            (event) => {
                if (
                    !accountMenu.contains(
                        event.target
                    )
                ) {
                    closeAccountMenu();
                }
            }
        );


        document.addEventListener(
            "keydown",
            (event) => {
                if (event.key === "Escape") {
                    closeAccountMenu();
                }
            }
        );


        if (Auth.requireAuth()) {
            initializeDashboard();
        }

        async function initializeDashboard() {
            await Promise.all([
                loadCurrentUser(),
                loadServers()
            ]);

            setInterval(
                refreshStatuses,
                5000
            );
        }

       async function loadCurrentUser() {
            try {
                const response =
                    await Auth.apiRequest(
                        "/auth/me"
                    );

                const user =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        user.detail
                        || "Could not load account"
                    );
                }

                const firstCharacter =
                    user.username
                        .charAt(0)
                        .toUpperCase();

                accountAvatar.textContent =
                    firstCharacter;

                accountUsername.textContent =
                    user.username;

                accountEmail.textContent =
                    user.email;

                accountButton.title =
                    `Account: ${user.username}`;

            } catch (error) {
                accountAvatar.textContent = "?";

                showMessage(
                    error.message,
                    true
                );
            }
        }

        async function loadServers() {
            const serverList =
                document.getElementById("server-list");

            serverList.textContent = "Loading servers...";

            try {
                const response = await Auth.apiRequest("/servers");

                const servers = await response.json();

                serverList.replaceChildren();

                if (servers.length === 0) {
                    const emptyState = document.createElement("div");

                    emptyState.className = "empty-state";
                    emptyState.textContent =
                        "You do not have any servers yet.";

                    serverList.appendChild(emptyState);

                    return;
                }

                for (const server of servers) {
                    serverList.appendChild(
                        createServerCard(server)
                    );
                }

                await refreshStatuses();

            } catch (error) {
                serverList.replaceChildren();

                showMessage(
                    error.message,
                    true
                );
            }
        }

        function createServerCard(server) {
            const card = document.createElement("article");

            card.className = "server-card";
            card.dataset.serverId = server.id;

            const title = document.createElement("h2");

            title.textContent = server.name;

            const info = document.createElement("div");

            info.className = "server-info";

            const version = document.createElement("div");

            version.textContent = `Version: ${server.version}`;

            const host = document.createElement("div");

            host.textContent = `IP: ${server.host}`;

            const port = document.createElement("div");

            port.textContent = `Port: ${server.port}`;

            const address = document.createElement("div");

            address.textContent = `Address: ${server.address}`;

            const status = document.createElement("div");

            status.className = "server-status status-offline";
            status.textContent = "Status: checking...";

            const players = document.createElement("div");

            players.className = "server-players";
            players.textContent = "Players: 0/0";

            info.append(
                version,
                host,
                port,
                address,
                status,
                players
            );

            const actions = document.createElement("div");

            actions.className = "server-actions";

            actions.append(
                createActionButton(
                    "Start",
                    "primary",
                    (event) => runServerAction(
                        server.id,
                        "start",
                        event.currentTarget
                    )
                ),
                createActionButton(
                    "Stop",
                    "danger",
                    () => runServerAction(server.id, "stop")
                ),
                createActionButton(
                    "Day",
                    "warning",
                    () => runServerAction(server.id, "day")
                ),
                createActionButton(
                    "Night",
                    "secondary",
                    () => runServerAction(server.id, "night")
                ),
                createActionButton(
                    "Delete",
                    "danger",
                    () => deleteServer(server.id, server.name)
                )
            );

            card.append(
                title,
                info,
                actions
            );

            return card;
        }

        function createActionButton(
            text,
            className,
            handler
        ) {
            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";
            button.textContent = text;
            button.className = className;

            button.addEventListener(
                "click",
                handler
            );

            return button;
        }

        function setServerStarting(
            card,
            startButton
        ) {
            const status =
                card.querySelector(
                    ".server-status"
                );

            const players =
                card.querySelector(
                    ".server-players"
                );

            card.dataset.state = "starting";
            card.classList.add("server-card-starting");

            status.textContent =
                "Status: starting...";

            status.className =
                "server-status status-starting";

            players.textContent =
                "Players: waiting for server...";

            startButton.disabled = true;

            startButton.replaceChildren();

            const spinner =
                document.createElement("span");

            spinner.className =
                "button-spinner";

            const label =
                document.createElement("span");

            label.textContent =
                "Starting...";

            startButton.append(
                spinner,
                label
            );
        }


        function setServerOnline(
            card,
            data
        ) {
            const status =
                card.querySelector(
                    ".server-status"
                );

            const players =
                card.querySelector(
                    ".server-players"
                );

            const startButton =
                card.querySelector(
                    ".server-actions .primary"
                );

            card.dataset.state = "online";

            card.classList.remove(
                "server-card-starting"
            );

            status.textContent =
                "Status: online";

            status.className =
                "server-status status-online";

            players.textContent =
                `Players: ${data.players}/${data.max_players}`;

            if (startButton) {
                startButton.disabled = true;
                startButton.textContent = "Running";
            }
        }


        function setServerOffline(card) {
            const status =
                card.querySelector(
                    ".server-status"
                );

            const players =
                card.querySelector(
                    ".server-players"
                );

            const startButton =
                card.querySelector(
                    ".server-actions .primary"
                );

            card.dataset.state = "offline";

            card.classList.remove(
                "server-card-starting"
            );

            status.textContent =
                "Status: offline";

            status.className =
                "server-status status-offline";

            players.textContent =
                "Players: 0/0";

            if (startButton) {
                startButton.disabled = false;
                startButton.textContent = "Start";
            }
        }


        function wait(milliseconds) {
            return new Promise(
                (resolve) => {
                    setTimeout(
                        resolve,
                        milliseconds
                    );
                }
            );
        }


        async function waitForServerOnline(
            serverId,
            card
        ) {
            const maximumAttempts = 60;

            for (
                let attempt = 0;
                attempt < maximumAttempts;
                attempt += 1
            ) {
                await wait(1000);

                const response =
                    await Auth.apiRequest(
                        `/servers/${serverId}/status`
                    );

                const data =
                    await response.json();

                if (data.online) {
                    setServerOnline(
                        card,
                        data
                    );

                    showMessage(
                        "Server is online",
                        false
                    );

                    return;
                }
            }

            card.dataset.state = "offline";

            card.classList.remove(
                "server-card-starting"
            );

            const status =
                card.querySelector(
                    ".server-status"
                );

            const startButton =
                card.querySelector(
                    ".server-actions .primary"
                );

            status.textContent =
                "Status: startup is taking longer than expected";

            status.className =
                "server-status status-starting";

            if (startButton) {
                startButton.disabled = false;
                startButton.textContent = "Start";
            }

            showMessage(
                "The server is taking longer than expected to start",
                true
            );
        }

        async function runServerAction(
            serverId,
            action,
            actionButton = null
        ) {
            const card =
                actionButton
                    ? actionButton.closest(
                        ".server-card"
                    )
                    : document.querySelector(
                        `[data-server-id="${serverId}"]`
                    );

            if (
                action === "start"
                && card
                && actionButton
            ) {
                setServerStarting(
                    card,
                    actionButton
                );
            }

            try {
                const response =
                    await Auth.apiRequest(
                        `/servers/${serverId}/${action}`,
                        {
                            method: "POST"
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok
                    || !data.success
                ) {
                    if (
                        action === "start"
                        && card
                    ) {
                        setServerOffline(card);
                    }

                    throw new Error(
                        data.detail
                        || data.message
                        || "Server action failed"
                    );
                }

                showMessage(
                    data.message,
                    false
                );

                if (
                    action === "start"
                    && card
                ) {
                    await waitForServerOnline(
                        serverId,
                        card
                    );

                    return;
                }

                await wait(1000);
                await refreshStatuses();

            } catch (error) {
                if (
                    action === "start"
                    && card
                ) {
                    setServerOffline(card);
                }

                showMessage(
                    error.message,
                    true
                );
            }
        }

        async function deleteServer(serverId, serverName) {
            const confirmed = window.confirm(
                `Delete server "${serverName}"?`
            );

            if (!confirmed) {
                return;
            }

            try {
                const response = await Auth.apiRequest(
                    `/servers/${serverId}`,
                    {
                        method: "DELETE"
                    }
                );

                const data = await response.json();

                showMessage(
                    data.message,
                    !data.success
                );

                if (data.success) {
                    await loadServers();
                }

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );
            }
        }

       async function refreshStatuses() {
            const cards =
                document.querySelectorAll(
                    "[data-server-id]"
                );

            for (const card of cards) {
                const serverId =
                    card.dataset.serverId;

                try {
                    const response =
                        await Auth.apiRequest(
                            `/servers/${serverId}/status`
                        );

                    const data =
                        await response.json();

                    if (data.online) {
                        setServerOnline(
                            card,
                            data
                        );

                        continue;
                    }

                    if (
                        card.dataset.state
                        === "starting"
                    ) {
                        continue;
                    }

                    setServerOffline(card);

                } catch (error) {
                    console.error(error);
                }
            }
        }

        function showMessage(text, isError) {
            const message = document.getElementById("message");

            message.textContent = text;

            message.className = isError
                ? "message error"
                : "message success";
        }
    </script>
</body>
</html>
