<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Hosting</title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>Minecraft Hosting</h1>

                <div id="current-user">
                    Loading account...
                </div>
            </div>

            <div class="header-actions">
                <a
                    class="button primary"
                    href="/create"
                >
                    Create server
                </a>

                <button
                    id="logout-button"
                    class="secondary"
                    type="button"
                >
                    Log out
                </button>
            </div>
        </header>

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>

        <section
            id="server-list"
            class="server-list"
        ></section>
    </main>

    <script src="/static/auth.js"></script>

    <script>
        if (Auth.requireAuth()) {
            initializeDashboard();
        }

        const logoutButton =
            document.getElementById(
                "logout-button"
            );

        logoutButton.addEventListener(
            "click",
            Auth.logout
        );

        async function initializeDashboard() {
            await Promise.all([
                loadCurrentUser(),
                loadServers()
            ]);

            setInterval(
                refreshStatuses,
                5000
            );
        }

        async function loadCurrentUser() {
            try {
                const response =
                    await Auth.apiRequest(
                        "/auth/me"
                    );

                const user =
                    await response.json();

                document.getElementById(
                    "current-user"
                ).textContent =
                    `Logged in as ${user.username}`;

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );
            }
        }

        async function loadServers() {
            const serverList =
                document.getElementById(
                    "server-list"
                );

            serverList.textContent =
                "Loading servers...";

            try {
                const response =
                    await Auth.apiRequest(
                        "/servers"
                    );

                const servers =
                    await response.json();

                serverList.replaceChildren();

                if (servers.length === 0) {
                    const emptyState =
                        document.createElement(
                            "div"
                        );

                    emptyState.className =
                        "empty-state";

                    emptyState.textContent =
                        "You do not have any servers yet.";

                    serverList.appendChild(
                        emptyState
                    );

                    return;
                }

                for (const server of servers) {
                    serverList.appendChild(
                        createServerCard(server)
                    );
                }

                await refreshStatuses();

            } catch (error) {
                serverList.replaceChildren();

                showMessage(
                    error.message,
                    true
                );
            }
        }

        function createServerCard(server) {
            const card =
                document.createElement(
                    "article"
                );

            card.className = "server-card";
            card.dataset.serverId = server.id;

            const title =
                document.createElement("h2");

            title.textContent = server.name;

            const info =
                document.createElement("div");

            info.className = "server-info";

            const version =
                document.createElement("div");

            version.textContent =
                `Version: ${server.version}`;

            const address =
                document.createElement("div");

            address.textContent =
                `Port: ${server.port}`;

            const status =
                document.createElement("div");

            status.className =
                "server-status status-offline";

            status.textContent =
                "Status: checking...";

            const players =
                document.createElement("div");

            players.className =
                "server-players";

            players.textContent =
                "Players: 0/0";

            info.append(
                version,
                address,
                status,
                players
            );

            const actions =
                document.createElement("div");

            actions.className =
                "server-actions";

            actions.append(
                createActionButton(
                    "Start",
                    "primary",
                    () => runServerAction(
                        server.id,
                        "start"
                    )
                ),
                createActionButton(
                    "Stop",
                    "danger",
                    () => runServerAction(
                        server.id,
                        "stop"
                    )
                ),
                createActionButton(
                    "Day",
                    "warning",
                    () => runServerAction(
                        server.id,
                        "day"
                    )
                ),
                createActionButton(
                    "Night",
                    "secondary",
                    () => runServerAction(
                        server.id,
                        "night"
                    )
                ),
                createActionButton(
                    "Delete",
                    "danger",
                    () => deleteServer(
                        server.id,
                        server.name
                    )
                )
            );

            card.append(
                title,
                info,
                actions
            );

            return card;
        }

        function createActionButton(
            text,
            className,
            handler
        ) {
            const button =
                document.createElement("button");

            button.type = "button";
            button.textContent = text;
            button.className = className;

            button.addEventListener(
                "click",
                handler
            );

            return button;
        }

        async function runServerAction(
            serverId,
            action
        ) {
            try {
                const response =
                    await Auth.apiRequest(
                        `/servers/${serverId}/${action}`,
                        {
                            method: "POST"
                        }
                    );

                const data =
                    await response.json();

                showMessage(
                    data.message,
                    !data.success
                );

                setTimeout(
                    refreshStatuses,
                    1000
                );

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );
            }
        }

        async function deleteServer(
            serverId,
            serverName
        ) {
            const confirmed = window.confirm(
                `Delete server "${serverName}"?`
            );

            if (!confirmed) {
                return;
            }

            try {
                const response =
                    await Auth.apiRequest(
                        `/servers/${serverId}`,
                        {
                            method: "DELETE"
                        }
                    );

                const data =
                    await response.json();

                showMessage(
                    data.message,
                    !data.success
                );

                if (data.success) {
                    await loadServers();
                }

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );
            }
        }

        async function refreshStatuses() {
            const cards = document.querySelectorAll(
                "[data-server-id]"
            );

            for (const card of cards) {
                const serverId =
                    card.dataset.serverId;

                try {
                    const response =
                        await Auth.apiRequest(
                            `/servers/${serverId}/status`
                        );

                    const data =
                        await response.json();

                    const status =
                        card.querySelector(
                            ".server-status"
                        );

                    const players =
                        card.querySelector(
                            ".server-players"
                        );

                    if (data.online) {
                        status.textContent =
                            "Status: online";

                        status.className =
                            "server-status status-online";

                        players.textContent =
                            `Players: ${data.players}/${data.max_players}`;

                    } else {
                        status.textContent =
                            "Status: offline";

                        status.className =
                            "server-status status-offline";

                        players.textContent =
                            "Players: 0/0";
                    }

                } catch (error) {
                    console.error(error);
                }
            }
        }

        function showMessage(
            text,
            isError
        ) {
            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = text;

            message.className = isError
                ? "message error"
                : "message success";
        }
    </script>
</body>

</html>
