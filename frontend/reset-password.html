<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset password</title>

    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/png" href="/static/logo.png">
</head>

<body>
    <main class="auth-container">
        <section class="card">
            <h1>Reset password</h1>

            <p class="verification-description">
                Enter the code from your email and choose a new password.
            </p>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="code">Reset code</label>
                    <input id="code" class="verification-code-input" name="code" type="text" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required>
                </div>

                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input id="new-password" name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                </div>

                <button id="submit-button" class="primary full-width" type="submit">
                    Reset password
                </button>
            </form>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="auth-link">
                <a href="/forgot-password">Request another code</a>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("reset-password-form");
        const submitButton = document.getElementById("submit-button");
        const message = document.getElementById("message");
        const emailInput = document.getElementById("email");

        const queryParameters =
            new URLSearchParams(
                window.location.search
            );

        const emailFromQuery =
            queryParameters.get("email");

        if (emailFromQuery) {
            emailInput.value = emailFromQuery;
            document.getElementById("code").focus();
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            submitButton.disabled = true;
            message.textContent = "";

            try {
                const response = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: form.email.value.trim(),
                        code: form.code.value.trim(),
                        new_password: form.new_password.value,
                        confirm_password: form.confirm_password.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail
                        || "Password reset failed"
                    );
                }

                message.textContent =
                    data.message
                    + ". You can now log in.";

                message.className =
                    "message success";

                form.reset();

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1400);

            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";

            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
