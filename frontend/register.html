<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>
    <main class="auth-container">
        <section class="card">
            <h1>Create account</h1>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        minlength="3"
                        maxlength="32"
                        pattern="[A-Za-z0-9_]+"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    id="submit-button"
                    class="primary full-width"
                    type="submit"
                >
                    Register
                </button>
            </form>

            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>

            <div class="auth-link">
                Already registered?
                <a href="/login">Log in</a>
            </div>
        </section>
    </main>

    <script src="/static/auth.js"></script>

    <script>
        Auth.redirectAuthenticatedUser();

        const form = document.getElementById(
            "register-form"
        );

        const message = document.getElementById(
            "message"
        );

        const submitButton = document.getElementById(
            "submit-button"
        );

        form.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                message.textContent = "";
                message.className = "message";

                submitButton.disabled = true;

                const payload = {
                    username: form.username.value.trim(),
                    email: form.email.value.trim(),
                    password: form.password.value
                };

                try {
                    const response = await fetch(
                        "/auth/register",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify(payload)
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.detail
                            || "Registration failed"
                        );
                    }

                    message.textContent =
                        "Account created successfully";

                    message.className =
                        "message success";

                    setTimeout(
                        () => {
                            window.location.href =
                                "/login";
                        },
                        700
                    );

                } catch (error) {
                    message.textContent =
                        error.message;

                    message.className =
                        "message error";

                } finally {
                    submitButton.disabled = false;
                }
            }
        );
    </script>
</body>

</html>
