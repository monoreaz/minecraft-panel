<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify email</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <main class="auth-container">
        <section class="card">
            <h1>Verify your email</h1>

            <p class="verification-description">
                Enter the 6-digit code sent to your email.
            </p>

            <form id="verification-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="code">Verification code</label>
                    <input id="code" class="verification-code-input" name="code" type="text" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required>
                </div>

                <button id="verify-button" class="primary full-width" type="submit">
                    Verify email
                </button>
            </form>

            <button id="resend-button" class="secondary full-width verification-resend" type="button">
                Send a new code
            </button>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="auth-link">
                <a href="/login">Back to login</a>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("verification-form");
        const emailInput = document.getElementById("email");
        const codeInput = document.getElementById("code");
        const verifyButton = document.getElementById("verify-button");
        const resendButton = document.getElementById("resend-button");
        const message = document.getElementById("message");

        const queryParameters = new URLSearchParams(
            window.location.search
        );

        const emailFromQuery = queryParameters.get(
            "email"
        );

        if (emailFromQuery) {
            emailInput.value = emailFromQuery;
            codeInput.focus();
        }

        function showMessage(text, isError) {
            message.textContent = text;

            message.className = isError
                ? "message error"
                : "message success";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            verifyButton.disabled = true;

            try {
                const response = await fetch(
                    "/auth/verify-email",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: emailInput.value.trim(),
                            code: codeInput.value.trim()
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail
                        || "Email verification failed"
                    );
                }

                showMessage(
                    data.message,
                    false
                );

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1200);

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );

            } finally {
                verifyButton.disabled = false;
            }
        });

        resendButton.addEventListener("click", async () => {
            const email = emailInput.value.trim();

            if (!email) {
                showMessage(
                    "Enter your email first",
                    true
                );

                emailInput.focus();
                return;
            }

            resendButton.disabled = true;

            try {
                const response = await fetch(
                    "/auth/resend-verification",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail
                        || "Could not resend code"
                    );
                }

                showMessage(
                    data.message,
                    false
                );

            } catch (error) {
                showMessage(
                    error.message,
                    true
                );

            } finally {
                setTimeout(() => {
                    resendButton.disabled = false;
                }, 3000);
            }
        });
    </script>
</body>
</html>
