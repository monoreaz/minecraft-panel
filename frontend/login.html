<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/png" href="/static/logo.png">
</head>

<body>
    <main class="auth-container">
        <section class="card">
            <h1>Log in</h1>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>

                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

               <div class="form-group">
    <label for="password">Password</label>

    <div class="password-field">
        <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="toggle-password"
            class="password-toggle"
            type="button"
            aria-label="Show password"
            aria-pressed="false"
        >
            <svg
                class="password-icon password-icon-show"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>
            </svg>

            <svg
                class="password-icon password-icon-hide"
                viewBox="0 0 24 24"
                aria-hidden="true"
                hidden
            >
                <path
                    d="M3 3l18 18"
                ></path>

                <path
                    d="M10.6 6.2A11.5 11.5 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3 3.8"
                ></path>

                <path
                    d="M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 4.1-.8"
                ></path>

                <path
                    d="M9.9 9.9a3 3 0 0 0 4.2 4.2"
                ></path>
            </svg>
        </button>
    </div>
</div>

                <button id="submit-button" class="primary full-width" type="submit">
                    Log in
                </button>
            </form>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="auth-link">
                No account yet?
                <a href="/register">Register</a>
            </div>
            
            <div class="auth-link">
                <a href="/verify-email">Verify email</a>
            </div>
        </section>
    </main>

    <script src="/static/auth.js"></script>

    <script>
        Auth.redirectAuthenticatedUser();

        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        const passwordInput =
    document.getElementById(
        "password"
    );

const togglePasswordButton =
    document.getElementById(
        "toggle-password"
    );

const showPasswordIcon =
    togglePasswordButton.querySelector(
        ".password-icon-show"
    );

const hidePasswordIcon =
    togglePasswordButton.querySelector(
        ".password-icon-hide"
    );


togglePasswordButton.addEventListener(
    "click",
    () => {
        const passwordIsVisible =
            passwordInput.type === "text";

        passwordInput.type =
            passwordIsVisible
                ? "password"
                : "text";

        showPasswordIcon.hidden =
            !passwordIsVisible;

        hidePasswordIcon.hidden =
            passwordIsVisible;

        togglePasswordButton.setAttribute(
            "aria-label",
            passwordIsVisible
                ? "Show password"
                : "Hide password"
        );

        togglePasswordButton.setAttribute(
            "aria-pressed",
            String(!passwordIsVisible)
        );

        passwordInput.focus();
    }
);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            message.className = "message";

            submitButton.disabled = true;

            const body = new URLSearchParams();

            body.set("username", form.username.value.trim());
            body.set("password", form.password.value);

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Login failed");
                }

                Auth.setToken(data.access_token);

                window.location.href = "/";

            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";

            } finally {
                submitButton.disabled = false;
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
    const forms = document.querySelectorAll("form");

    forms.forEach((form) => {
        form.setAttribute("autocomplete", "off");
    });

    const inputs = document.querySelectorAll("input");

    inputs.forEach((input) => {
        input.setAttribute("autocomplete", "off");
        input.setAttribute("autocorrect", "off");
        input.setAttribute("autocapitalize", "off");
        input.setAttribute("spellcheck", "false");
    });
});
    </script>
</body>
</html>
