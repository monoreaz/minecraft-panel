<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create server</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <main class="auth-container">
        <section class="card">
            <h1>Create server</h1>

            <form id="create-form">
                <div class="form-group">
                    <label for="name">Server name</label>

                    <input id="name" name="name" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" required>
                </div>

                <div class="form-group">
                    <label for="version">Minecraft version</label>

                    <input id="version" name="version" type="text" placeholder="1.21.1" required>
                </div>

                <button id="submit-button" class="primary full-width" type="submit">
                    Create server
                </button>
            </form>

            <div id="message" class="message" aria-live="polite"></div>

            <div class="auth-link">
                <a href="/">Back to dashboard</a>
            </div>
        </section>
    </main>

    <script src="/static/auth.js"></script>

    <script>
        if (!Auth.requireAuth()) {
            throw new Error("Authentication required");
        }

        const form = document.getElementById("create-form");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            message.className = "message";

            submitButton.disabled = true;

            const payload = {
                name: form.name.value.trim(),
                version: form.version.value.trim()
            };

            try {
                const response = await Auth.apiRequest("/servers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    const detail =
                        typeof data.detail === "string"
                            ? data.detail
                            : "Invalid server data";

                    throw new Error(detail);
                }

                if (!data.success) {
                    throw new Error(
                        data.message || "Server creation failed"
                    );
                }

                message.textContent = data.message;
                message.className = "message success";

                setTimeout(() => {
                    window.location.href = "/";
                }, 700);

            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";

            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
